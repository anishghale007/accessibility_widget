name: web_deploy

on:
  push:
    branches:
      - main

jobs:
  flutter_web_deployment:
    name: Web deployment
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: example
    steps:
      - name: 🐦 Checkout
        uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc   # keeps CI on the same version fvm uses locally

      - name: 📦 Installing dependencies
        run: flutter pub get

      - name: ⚙️ Building for the web
        run: flutter build web --base-href "/accessibility_widget/" --csp

      - name: 🚫 Disable Jekyll
        run: touch build/web/.nojekyll

      - name: 📝 Setting the git username
        run: git config user.name github-actions

      - name: 📧 Setting the git email
        run: git config user.email github-actions@github.com

      - name: 📦 Adding web source
        run: git --work-tree build/web add --all

      - name: 📝 Adding a commit message
        run: git commit -m "Automatic deployment by github-actions"

      - name: 📤 Automatic web deployment
        run: git push origin HEAD:gh-pages --force
